name: Build and Release KOReader Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach the zip to'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare plugin folder
        run: |
          mkdir readingruler.koplugin
          shopt -s extglob
          cp -r !(readingruler.koplugin|.git|.github) readingruler.koplugin/

      - name: Create zip archive
        run: |
          zip -r readingruler.koplugin.zip readingruler.koplugin
          unzip -l readingruler.koplugin.zip

      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG"
          gh release upload "$TAG" readingruler.koplugin.zip --clobber --repo "$GITHUB_REPOSITORY"
